{% extends "base.html" %}
{% block title %}{{ "Edit Lead" if lead else "Add Lead" }}{% endblock %}
{% block content %}

<h2>{{ "Edit Lead" if lead else "Add Lead" }}</h2>

<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">First name</label>
      <input type="text" name="first_name" class="form-control" required
             value="{{ lead.first_name if lead else '' }}">
    </div>
    <div class="col">
      <label class="form-label">Last name</label>
      <input type="text" name="last_name" class="form-control" required
             value="{{ lead.last_name if lead else '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" value="{{ lead.email if lead else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control" value="{{ lead.phone if lead else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Company</label>
    <input type="text" name="company" class="form-control" value="{{ lead.company if lead else '' }}">
  </div>

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Stage</label>
      <select name="stage" class="form-select">
        {% for s in stages %}
          <option value="{{ s }}" {% if lead and lead.stage == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col">
      <label class="form-label">Source</label>
      <select name="source" class="form-select">
        <option value="">-- Select --</option>
        {% for s in sources %}
          <option value="{{ s }}" {% if lead and lead.source == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Product Interest</label>
      <select name="product_interest" class="form-select">
        <option value="">-- Select --</option>
        {% for p in product_interests %}
          <option value="{{ p }}" {% if lead and lead.product_interest == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col">
      <label class="form-label">Estimated Value ($)</label>
      <input type="number" step="0.01" name="estimated_value" class="form-control"
             value="{{ lead.estimated_value if lead else '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control" rows="3">{{ lead.notes if lead else '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('leads.index') }}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
