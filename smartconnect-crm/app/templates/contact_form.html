{% extends "base.html" %}
{% block title %}{{ "Edit Contact" if contact else "Add Contact" }}{% endblock %}
{% block content %}

<h2>{{ "Edit Contact" if contact else "Add Contact" }}</h2>

<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">First name</label>
      <input type="text" name="first_name" class="form-control" required
             value="{{ contact.first_name if contact else '' }}">
    </div>
    <div class="col">
      <label class="form-label">Last name</label>
      <input type="text" name="last_name" class="form-control" required
             value="{{ contact.last_name if contact else '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control"
           value="{{ contact.email if contact else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control"
           value="{{ contact.phone if contact else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Company</label>
    <input type="text" name="company" class="form-control"
           value="{{ contact.company if contact else '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Product Interest</label>
    <select name="product_interest" class="form-select">
      <option value="">-- Select --</option>
      {% for option in ["Phone", "Laptop", "Tablet", "Accessory", "Other"] %}
        <option value="{{ option }}" {% if contact and contact.product_interest == option %}selected{% endif %}>
          {{ option }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control" rows="3">{{ contact.notes if contact else '' }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('contacts.index') }}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
